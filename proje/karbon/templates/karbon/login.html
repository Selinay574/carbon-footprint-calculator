{% load static %}<!--static klasöründeki dosyaları kullanmak için.-->
{% load crispy_forms_tags %}<!--django formu render edilmesi için.-->

<!doctype html>
<html lang="tr"><!--türkçe karakter kullanımı için.-->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    /><!--bootstrap css dahil edildi.-->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" /><!--css dosyası dahil edildi.-->
    <link
      href="https://getbootstrap.com/docs/5.3/assets/css/docs.css"
      rel="stylesheet"
    />
    <title>Giriş Yap</title><!--başlık belirtme.-->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script><!--bootstrap js  projeye dahil edildi.-->
  </head>
  <body>
    <div class="container p-5">
      {% for message in messages %}<!--kullanıcı kayıt olduğunda veya işlem başarılı olduğunda mesaj göstermek için.-->
        {% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}
          <p id="message" class="alert alert-success">{{ message }}</p><!--yeşil uyarı kutusunda backend den gelen mesaj.-->
        {% endif %}
      {% endfor %}

      <div class="row justify-content-center"><!--ortalamak için.-->
        <div class="col-md-6 shadow-lg bg-white p-5 rounded-5">
          <h3>Kullanıcı Girişi</h3><!--başlık-->
          <br />
          <br />

          <form method="POST" autocomplete="off"><!--veri gönderme ve otomatik doldurma da kapalıdır.-->
            {% csrf_token %}<!--django güvenliği.-->
            {{ LoginForm|crispy }}<!--form otomatik oluşturuldu.-->
            <br />
            <div class="d-flex justify-content-center">
              <button type="submit" class="btn btn-success w-50"><!--buton oluşturuldu.-->
                Giriş Yap
              </button>
            </div>
          </form>

          <br />

          <div class="text-center">
            <a href="{% url 'register' %}">Henüz Hesabın Yok mu?</a><!--kullanıcıyı yönlendirme.-->
          </div>
        </div>
      </div>
    </div>

    <script src="{% static 'js/app.js' %}"></script><!--js dosyası için.-->
  </body>
</html>
